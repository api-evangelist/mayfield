aid: mayfield
name: Mayfield Fund
description: >-
  Mayfield Fund is an early-stage venture capital firm founded in 1969 and
  headquartered on Sand Hill Road in Menlo Park, California, with a presence in
  Mumbai, India. One of the oldest continuously active Silicon Valley firms,
  Mayfield describes itself as "people first, from inception" and reports that
  roughly 70% of its investments begin at company inception, positioning it as
  the first institutional investor for early-stage founders. The firm invests
  primarily at the Seed, Series A, and Series B stages across artificial
  intelligence, enterprise software, cloud and cybersecurity infrastructure,
  semiconductors, consumer and social commerce, and human and planetary health.
  Mayfield reports approximately $3B in assets under management (and states it
  has committed $3B to AI investments), has backed more than 550 companies over
  its history, and counts 120+ IPOs and 225+ M&A exits including Genentech,
  Lyft, HashiCorp, Poshmark, Marketo, Couchbase, SolarCity, Intuitive Surgical,
  and Compaq. In 2023 the firm raised $955M across two new funds dedicated to
  early-stage investing.
